services:
  apache:
    build: .docker/apache
    container_name: ${PROJECT_NAME}_apache
    ports:
      - "${APACHE_PORT:-8089}:80"
    volumes:
      - .:/var/www/app:cached
    depends_on:
      - php
    networks:
      - backend_recettes

  php:
    build:
      context: .docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: ${PROJECT_NAME}_php
    volumes:
      - .:/var/www/app:cached
    networks:
      - backend_recettes

networks:
  backend_recettes:
    external: true
    name: recettes_network
