form:
  email:
    required: "Veuillez saisir une adresse email."
    invalid: "L'adresse email saisie n'est pas valide."
  password:
    required: "Veuillez saisir un mot de passe."
    valid: "Le mot de passe doit contenir au moins une majuscule, une minuscule, un chiffre et un caractère spécial."
    length_min: "Le mot de passe doit contenir au moins {{ limit }} caractères."
  password_confirmation:
    required: "Veuillez confirmer votre mot de passe."
    mismatch: "Les deux mots de passe ne correspondent pas."
  gender:
    required: "Veuillez sélectionner votre civilité."
  firstname:
    required: "Veuillez saisir votre prénom."
    max_length: "Votre prénom ne doit pas dépasser {{ limit }} caractères."
    invalid: "Votre prénom contient des caractères non autorisés."
  lastname:
    required: "Veuillez saisir votre nom."
    max_length: "Votre nom ne doit pas dépasser {{ limit }} caractères."
    invalid: "Votre nom contient des caractères non autorisés."
  birthdate:
    required: "Veuillez saisir votre date de naissance."
    invalid: "Votre date de naissance doit être postérieure au 01/01/1900."
  street:
    required: "Veuillez saisir votre adresse."
    max_length: "Votre adresse ne doit pas dépasser {{ limit }} caractères."
  complement:
    max_length: "Le complément d'adresse ne doit pas dépasser {{ limit }} caractères."
  postal_code:
    required: "Veuillez saisir votre code postal."
    invalid: "Le code postal doit contenir exactement 5 chiffres."
  city:
    required: "Veuillez saisir votre ville."
    max_length: "Votre ville ne doit pas dépasser {{ limit }} caractères."
  country:
    required: "Veuillez sélectionner votre pays."
    invalid: "Le pays sélectionné n'est pas valide."
  phone_number:
    max_length: "Le numéro de téléphone ne doit pas dépasser {{ limit }} caractères."
    invalid: "Veuillez saisir un numéro de téléphone français valide."
  extra_information:
    max_length: "Les informations complémentaires ne doivent pas dépasser {{ limit }} caractères."
