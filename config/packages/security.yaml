security:
    # Hashage minimal requis par le bundle de sécurité
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Un provider en mémoire générique suffit si le front n'a pas d'entités User locales
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js|assets|build)/
            security: false
            
        # Pare-feu principal du front (complètement public et sans état)
        main:
            lazy: true
            provider: users_in_memory

    # Le front laisse passer tout le monde, c'est le code PHP qui interroge l'API du Back
    access_control:
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
