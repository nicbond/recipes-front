security:
    # Hashage minimal requis par le bundle de sécurité
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        api_user_provider:
            id: App\Security\User\ApiUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js|assets|build)/
            security: false
            
        main:
            lazy: true # Allows public routes in your API (e.g., recipes) to respond ultra-fast without accessing the session, while loading the user and their roles as soon as the frontend calls a protected route.
            provider: api_user_provider
            custom_authenticators:
                - App\Security\ApiFormAuthenticator
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true

    access_control:
        - { path: ^/mon-compte, roles: ROLE_CONSUMER }
        - { path: ^/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
